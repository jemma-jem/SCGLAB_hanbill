<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합청구 고객번호 등록 / 해지 · 한전 민원 안내</title>
  <style>
    :root {
      --primary: #1B3F72;
      --primary-light: #2E5C9E;
      --accent: #E8F0FB;
      --orange: #E8722A;
      --green: #27AE60;
      --gray-bg: #F5F7FA;
      --gray-border: #DDE3ED;
      --text: #1A202C;
      --text-sub: #4A5568;
      --white: #FFFFFF;
      --radius: 12px;
      --shadow: 0 2px 16px rgba(27,63,114,0.10);
      --chat-bg: #B6CCE0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--chat-bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: var(--white);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .logo span { color: #7EB3FF; }
    .header-badge {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .ch-profile {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .ch-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--white);
      color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; letter-spacing: -0.5px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .ch-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .ch-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.72);
      margin-top: 1px;
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: var(--white);
      padding: 36px 20px 40px;
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      white-space: nowrap;
    }
    .hero h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 13.5px;
      color: rgba(255,255,255,0.82);
      line-height: 1.65;
    }
    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      background: var(--white);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 11px 24px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* ── Section Nav ── */
    .tab-nav {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      scrollbar-width: none;
      background: var(--white);
      border-bottom: 1px solid var(--gray-border);
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1.5px solid var(--gray-border);
      background: var(--white);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    /* ── Main container ── */
    main { padding: 20px 16px 80px; max-width: 640px; margin: 0 auto; }

    /* ── Section ── */
    .section { display: none; }
    .section.active { display: block; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(255,255,255,0.78);
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      box-shadow: 0 1px 3px rgba(27,63,114,0.08);
      margin: 4px auto 18px;
    }
    .section-title .num {
      background: var(--primary);
      color: white;
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }

    /* ── Service Card ── */
    .card {
      background: var(--white);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 3px rgba(27,63,114,0.14);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .card-header:active { background: var(--accent); }
    .card-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .card-title-wrap { flex: 1; }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .card-sub {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .card-arrow {
      color: var(--text-sub);
      font-size: 18px;
      transition: transform 0.25s;
    }
    .card.open .card-arrow { transform: rotate(180deg); }
    .card.open .card-header { border-bottom-color: var(--gray-border); }

    /* ── Card body ── */
    .card-body {
      display: none;
      padding: 16px;
    }
    .card.open .card-body { display: block; }

    .info-block {
      margin-bottom: 14px;
    }
    .info-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .path-box {
      background: var(--accent);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .path-sep { color: #7EB3FF; font-weight: 400; }

    .info-text {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.7;
      list-style: none;
    }
    .info-text li {
      padding-left: 14px;
      position: relative;
      margin-bottom: 4px;
    }
    .info-text li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary-light);
    }

    /* Process steps */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .step {
      background: var(--primary);
      color: white;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .step-arr {
      color: var(--primary-light);
      font-size: 14px;
      font-weight: 700;
    }

    /* Warning / note box */
    .note-box {
      background: #FFF8F3;
      border-left: 3px solid var(--orange);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      font-size: 12.5px;
      color: #7A4A2A;
      margin-top: 10px;
      line-height: 1.6;
    }

    /* CTA button */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: var(--white);
      color: var(--primary);
      border: 1.5px solid var(--primary-light);
      text-decoration: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      transition: all 0.15s;
    }
    .cta-btn:active { background: var(--accent); }
    .cta-btn-phone {
      background: #fff8f0;
      color: #e05a00;
      border-color: #f4a460;
      margin-top: 8px;
    }
    .cta-btn-phone:active { background: #ffe8cc; }


    /* ── 한빌 이용 안내 카드 ── */
    .hanbill-card {
      background: linear-gradient(135deg, var(--accent) 0%, #D6E6FF 100%);
      border: 1.5px solid var(--primary-light);
      border-radius: 4px 18px 18px 18px;
      padding: 18px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .hanbill-card .icon { font-size: 24px; flex-shrink: 0; }
    .hanbill-card .title { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .hanbill-card .desc { font-size: 12.5px; color: var(--text-sub); line-height: 1.6; }

    /* ── 서비스별 바로가기 목록 ── */
    .svc-list { margin-bottom: 16px; }
    .svc-item {
      background: var(--white);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 3px rgba(27,63,114,0.14);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .svc-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .svc-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border: 1.5px solid var(--primary-light);
      border-radius: 10px;
      background: var(--accent);
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .svc-link + .svc-link { margin-top: 8px; }
    .svc-link:active { background: var(--primary-light); }

    /* ── FAQ section ── */
    .faq-item {
      background: var(--white);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 1px 3px rgba(27,63,114,0.14);
      margin-bottom: 12px;
      overflow: hidden;
    }
    .faq-q {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .faq-q .q-badge {
      background: var(--primary);
      color: white;
      border-radius: 6px;
      padding: 1px 8px;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .faq-a {
      display: none;
      padding: 0 16px 16px 16px;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.7;
    }
    .faq-item.open .faq-a { display: block; }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -2px 14px rgba(27,63,114,0.12);
      display: flex;
      z-index: 99;
    }
    .bnav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px 12px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 600;
      gap: 3px;
      transition: color 0.15s;
    }
    .bnav-btn .ico { font-size: 20px; }
    .bnav-btn.active { color: var(--primary); }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin: 0 0 16px;
      z-index: 95;
    }

    /* 검색창 선택(포커스) 시: 위 메뉴 영역을 접고 검색창을 상단 고정 */
    body.search-mode header { display: none; }
    body.search-mode .hero { display: none; }
    body.search-mode .tab-nav { display: none; }
    body.search-mode .search-wrap {
      position: sticky;
      top: 0;
      margin: 0 -16px 12px;
      padding: 12px 16px;
      background: var(--chat-bg);
      box-shadow: 0 3px 12px rgba(27,63,114,0.14);
    }
    body.search-mode .search-result-bar {
      position: sticky;
      top: 62px;
      z-index: 94;
    }
    .search-input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border: 1.5px solid var(--gray-border);
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(27,63,114,0.10);
    }
    .search-input::placeholder { color: #9AA7B8; }
    .search-input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(46,92,158,0.14);
    }
    .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      width: 26px; height: 26px;
      border: none;
      background: var(--gray-bg);
      color: var(--text-sub);
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-wrap.has-text .search-clear { display: flex; }
    .search-result-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255,255,255,0.82);
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 14px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(27,63,114,0.08);
    }
    .search-result-bar a {
      color: var(--primary-light);
      font-weight: 700;
      font-size: 12px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .popular-search {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: -4px 2px 16px;
      font-size: 12.5px;
    }
    .popular-search .ps-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      color: var(--primary);
      flex-shrink: 0;
    }
    .popular-search .ps-label .star { color: #F5A623; }
    .popular-search .ps-kw {
      border: none;
      background: rgba(255,255,255,0.82);
      color: var(--primary-light);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(27,63,114,0.08);
      transition: background 0.15s, color 0.15s;
    }
    .popular-search .ps-kw:hover,
    .popular-search .ps-kw:active { background: var(--primary-light); color: #fff; }
    body.searching .popular-search { display: none; }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .card-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-light);
      background: rgba(27,63,114,0.06);
      border: 1px solid rgba(27,63,114,0.12);
      border-radius: 999px;
      padding: 3px 9px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .card-tag::before { content: "#"; opacity: 0.55; margin-right: 1px; }
    .card-tag:hover, .card-tag:active {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: #fff;
    }
    .no-result {
      display: none;
      text-align: center;
      padding: 44px 16px;
      color: var(--text-sub);
      font-size: 13.5px;
      line-height: 1.7;
    }

    /* ── Screenshot guide ── */
    .shot-hint {
      font-size: 11.5px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .shot-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .shot-row::-webkit-scrollbar { display: none; }
    .shot {
      flex: 0 0 160px;
      margin: 0;
    }
    .shot img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      display: block;
      background: #fff;
      border: 1px solid var(--gray-border);
      border-radius: 10px;
    }
    .shot figcaption {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      line-height: 1.5;
      margin-top: 7px;
    }
  </style>
  <style>
    body { padding-bottom: 24px; }
    .topbar { background: var(--primary); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
    .topbar a.back { color:#fff; text-decoration:none; font-size:20px; line-height:1; }
    .topbar .tt { font-size:15px; font-weight:700; }
    main { padding-top: 18px; }
    .card-header { cursor: default; }
    .pg-nav-wrap { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
    .pg-nav { flex:1; text-align:center; padding:12px; border:1.5px solid var(--gray-border); border-radius:12px; background:var(--white); color:var(--primary); text-decoration:none; font-size:13px; font-weight:700; }
    .home-link { display:block; text-align:center; margin-top:12px; color:var(--primary); font-size:12.5px; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <div class="topbar">
    
    <span class="tt">통합청구 고객번호 등록 / 해지</span>
  </div>
  <main>
    <div class="card open">
      <div class="card-header">
        <div class="card-icon">🔄</div>
        <div class="card-title-wrap">
          <div class="card-title">통합청구 고객번호 등록 / 해지</div>
          <div class="card-sub">기존 통합청구 계정에 고객번호 추가·삭제</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-block">
        <div class="info-label">안내사항</div>
        <ul class="info-text">
        <li>기존 통합청구 계정이 <strong>없는 경우</strong> → 먼저 「통합청구 계정 신규 생성」 진행</li>
        <li>대표 고객번호 조회 후 <strong>행 추가</strong>(등록) / <strong>행 삭제</strong>(해지) 처리</li>
        <li>최대 7개의 대표고객 선정 가능</li>
        </ul>
        </div>
        <div class="info-block">
        <div class="info-label">한전ON 경로</div>
        <div class="path-box">
        한전ON <span class="path-sep">›</span> 로그인
        <span class="path-sep">›</span> 추천메뉴
        <span class="path-sep">›</span> 통합청구 고객번호 등록 / 해지
        </div>
        </div>
        <div class="info-block">
        <div class="info-label">화면으로 보는 신청 방법</div>
        <div class="shot-hint">← 좌우로 넘겨보세요</div>
