name: 지자체 인사발령 자동 수집 (hr_archive.json)

# 매일 오전 9시(KST) 시정일보「피플」RSS와 지역신문 구글뉴스 RSS에서
# 지자체 인사발령을 수집해 hr_archive.json 을 갱신·커밋한다.
# ax-admin-v2.html 「영업 레이더」가 이 파일을 읽어 "담당자 변경 감지" 알림을 띄운다.
#
# 인사는 정기인사(1월·7월) 시즌에 몰리지만, 수시 발령도 있어 매일 수집한다.

on:
  schedule:
    - cron: '10 0 * * *'      # 00:10 UTC = 09:10 KST (뉴스 수집 10분 뒤 — 커밋 충돌 회피)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hr-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인사발령 수집 실행
        run: node collectors/hr_collector.js

      - name: 변경분 커밋 & 푸시
        run: |
          if [ -n "$(git status --porcelain hr_archive.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hr_archive.json
            git commit -m "chore(hr): 인사발령 자동 수집 $(TZ='Asia/Seoul' date +%Y-%m-%d)"
            # news-collect 워크플로와 같은 시각대라 원격이 앞서 있을 수 있음 → rebase 후 푸시
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
            echo "hr_archive.json 갱신 커밋 완료"
          else
            echo "변경 없음 — 커밋 생략"
          fi
