name: 뉴스 자동 수집 (news_archive.json)

# 평일 오전 8시(KST) 구글 뉴스 RSS에서 한전·전기요금·전자청구서 관련 기사를
# 수집해 news_archive.json 을 갱신·커밋한다. GitHub Pages 가 이 파일을 서빙하면
# ax-admin-v2.html 의 fetchLiveNews() 가 자동으로 최신 기사를 반영한다.

on:
  schedule:
    - cron: '0 23 * * 0-4'   # 23:00 UTC(일~목) = 08:00 KST(월~금) — 평일 오전 8시
  workflow_dispatch: {}       # 수동 실행(테스트) 허용

permissions:
  contents: write             # news_archive.json 커밋/푸시 권한

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 뉴스 수집 실행
        env:
          # ANTHROPIC_API_KEY 시크릿이 있으면 기사별 2줄 AI 요약 생성(없으면 자동 스킵).
          # 모델 변경이 필요하면 리포 변수(Variables)에 ANTHROPIC_MODEL 지정(기본 claude-opus-4-8).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node news_collector.js

      - name: 변경분 커밋 & 푸시
        run: |
          if [ -n "$(git status --porcelain news_archive.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news_archive.json
            git commit -m "chore(news): 자동 수집 $(TZ='Asia/Seoul' date +%Y-%m-%d)"
            git push
            echo "news_archive.json 갱신 커밋 완료"
          else
            echo "변경 없음 — 커밋 생략"
          fi
